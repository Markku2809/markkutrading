name: Päivitä aamun avaus

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write

jobs:
  update-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hae US500-data ja rakenna aamuanalyysi
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          UA={"User-Agent":"Mozilla/5.0 AIMTrading/2.0"}
          def get_json(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          def ema(xs,n):
              a=2/(n+1); v=xs[0]
              for x in xs[1:]:v=x*a+v*(1-a)
              return v
          def rsi(xs,n=14):
              dif=[b-a for a,b in zip(xs,xs[1:])][-n:]
              up=sum(max(x,0) for x in dif)/n; dn=sum(max(-x,0) for x in dif)/n
              return 100 if dn==0 else 100-(100/(1+up/dn))
          def market(symbol,name,interval="30m",period="60d"):
              u="https://query1.finance.yahoo.com/v8/finance/chart/"+urllib.parse.quote(symbol,safe="")+f"?range={period}&interval={interval}"
              d=get_json(u)["chart"]["result"][0]; q=d["indicators"]["quote"][0]
              rows=[(t,c,h,l) for t,c,h,l in zip(d["timestamp"],q["close"],q["high"],q["low"]) if None not in (c,h,l)]
              ts,cl,hi,lo=zip(*rows); closes=list(cl); last=closes[-1]; prev=closes[-2]
              return {"name":name,"symbol":symbol,"price":round(last,2),"change_pct":round((last/prev-1)*100,2),"ema20":ema(closes[-80:],20),"ema50":ema(closes[-120:],50),"rsi14":rsi(closes),"support":min(lo[-48:]),"resistance":max(hi[-48:]),"time":datetime.fromtimestamp(ts[-1],timezone.utc)}

          now=datetime.now(ZoneInfo("Europe/Helsinki")); errors=[]; markets=[]
          for symbol,name in [("ES=F","US500-futuuri"),("^GSPC","S&P 500 käteinen"),("^NDX","Nasdaq 100"),("GC=F","Kulta"),("^GDAXI","DAX")]:
              try:markets.append(market(symbol,name))
              except Exception as e:errors.append(name+": "+str(e))
          p=next((m for m in markets if m["symbol"]=="ES=F"),None)
          decision="epäselvä – ei treidiä"; direction="epäselvä"; confidence="heikko"
          summary="US500:n tuore tai riittävän yksiselitteinen hintanäyttö puuttuu."
          reasons=[]; rise="Ei vahvistettua noususkenaariota."; fall="Ei vahvistettua laskuskenaariota."; invalidation="Odota tuoretta hintaa ja selkeää rakennetta."
          if p:
              age=(datetime.now(timezone.utc)-p["time"]).total_seconds()/3600
              bull=[p["price"]>p["ema20"],p["ema20"]>p["ema50"],p["change_pct"]>0,52<=p["rsi14"]<=70]
              bear=[p["price"]<p["ema20"],p["ema20"]<p["ema50"],p["change_pct"]<0,30<=p["rsi14"]<=48]
              bs,ds=sum(bull),sum(bear)
              reasons=[f"Hinta {p['price']:.2f} suhteessa EMA20-tasoon {p['ema20']:.2f} ja EMA50-tasoon {p['ema50']:.2f}.",f"30 minuutin RSI(14) on {p['rsi14']:.1f}.",f"Viimeisimmän 30 minuutin muutoksen suunta on {p['change_pct']:+.2f} %.",f"Hintadatan ikä on {age:.1f} tuntia."]
              rise=f"Noususkenaario vahvistuu, jos US500-futuuri pysyy EMA20:n ({p['ema20']:.2f}) yläpuolella ja murtaa lasketun vastuksen {p['resistance']:.2f}."
              fall=f"Laskuskenaario vahvistuu, jos hinta jää EMA20:n ({p['ema20']:.2f}) alle ja rikkoo lasketun tuen {p['support']:.2f}."
              if age<=8 and bs>=3 and ds<=1:
                  decision="call-setup nyt";direction="todennäköinen nousupäivä";confidence="kohtalainen";summary="US500-futuurin tuore hinta, lyhyt trendi ja momentum kallistuvat nousupäivään.";invalidation=f"Nousunäkemys mitätöityy, jos hinta palautuu EMA20:n {p['ema20']:.2f} alle eikä palaudu nopeasti."
              elif age<=8 and ds>=3 and bs<=1:
                  decision="put-setup nyt";direction="todennäköinen laskupäivä";confidence="kohtalainen";summary="US500-futuurin tuore hinta, lyhyt trendi ja momentum kallistuvat laskupäivään.";invalidation=f"Laskunäkemys mitätöityy, jos hinta nousee EMA20:n {p['ema20']:.2f} yläpuolelle ja pysyy siellä."
              elif age<=8:
                  summary="US500-futuurin hinta, trendi ja momentum ovat ristiriidassa.";reasons.append("Ristiriita tarkoittaa kriteerien mukaan ei treidiä.")
              else:
                  summary="US500-markkina on kiinni tai viimeisin hintadata on liian vanhaa aamun suuntapäätökseen.";reasons.append("Vanha hinta ei oikeuta call- tai put-setupia.")
          sources=[]
          if p:sources.append({"title":"Yahoo Finance – S&P 500 E-mini Futures (ES=F)","url":"https://finance.yahoo.com/quote/ES=F/","published_at":p["time"].isoformat()})
          sources.append({"title":"TradingView – OANDA US500 graafi","url":"https://www.tradingview.com/symbols/OANDA-SPX500USD/","published_at":"reaaliaikainen graafilähde"})
          try:
              query=urllib.parse.quote('(S&P 500 OR US stocks OR Federal Reserve OR inflation) sourcecountry:US')
              news=get_json("https://api.gdeltproject.org/api/v2/doc/doc?query="+query+"&mode=ArtList&maxrecords=8&format=json&timespan=24h")
              for a in news.get("articles",[])[:8]:sources.append({"title":a.get("title","Markkinauutinen"),"url":a.get("url",""),"published_at":a.get("seendate","")})
          except Exception as e:errors.append("Uutiset: "+str(e))
          analyst_views=[]
          try:
              aq=urllib.parse.quote('(S&P 500 analyst outlook OR S&P 500 strategist outlook OR US stocks strategist)')
              ad=get_json("https://api.gdeltproject.org/api/v2/doc/doc?query="+aq+"&mode=ArtList&maxrecords=6&format=json&timespan=48h")
              for a in ad.get("articles",[])[:6]:analyst_views.append({"view":a.get("title","Analyytikkonäkemys"),"source":a.get("domain","Lähde"),"url":a.get("url",""),"published_at":a.get("seendate","")})
          except Exception as e:errors.append("Analyytikot: "+str(e))
          out={"decision":decision,"day_direction":direction,"confidence":confidence,"summary":summary,"reasons":reasons,"rise_scenario":rise,"fall_scenario":fall,"invalidation":invalidation,"generated_at":now.isoformat(),"instrument":"ES=F (US500/S&P 500 E-mini -viitefutuuri; ei varmennettu IG-instrumentti)","price_time":p["time"].isoformat() if p else "ei saatavilla","support":round(p["support"],2) if p else None,"resistance":round(p["resistance"],2) if p else None,"ema20":round(p["ema20"],2) if p else None,"ema50":round(p["ema50"],2) if p else None,"rsi14":round(p["rsi14"],1) if p else None,"markets":[{"name":m["name"],"price":m["price"],"change_pct":m["change_pct"]} for m in markets],"sources":sources,"analyst_views":analyst_views,"ig_note":"IG:n US500-instrumenttia ei ole varmennettu. Älä käytä viitetasoja sellaisenaan toimeksiantoon.","errors":errors,"disclaimer":"Ei sijoitusneuvontaa. Ei tuotto- tai riskittömyystakuuta. Kauppaa ei suoriteta käyttäjän puolesta."}
          os.makedirs("data",exist_ok=True)
          with open("data/aamun-avaus.json","w",encoding="utf-8") as f:json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Tallenna päivitetty analyysi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aamun-avaus.json
          git diff --cached --quiet || git commit -m "Päivitä US500-aamuanalyysi"
          git push
