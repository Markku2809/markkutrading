<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Delta Kalkulators</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    h1 { color: #333; }
    label { display: block; margin-top: 20px; }
    input { padding: 8px; width: 300px; margin-top: 5px; }
    button { padding: 10px 20px; margin-top: 20px; cursor: pointer; }
    #result { margin-top: 30px; font-size: 1.2em; }
    .footer { margin-top: 50px; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>

<h1>Delta Kalkulators</h1>
<p>Ievadi datus un aprēķini aptuveno opcijas Delta!</p>

<label for="stockPrice">Bāzes aktīva cena:</label>
<input type="number" id="stockPrice" placeholder="Piem., 22461">

<label for="strikePrice">Izpildes cena:</label>
<input type="number" id="strikePrice" placeholder="Piem., 22600">

<label for="iv">Svārstīgums (%):</label>
<input type="number" id="iv" placeholder="Piem., 18.15">

<br>
<button onclick="calculateDelta()">Aprēķināt Delta</button>

<div id="result"></div>

<div class="footer">
<p>Autori: Markku un Joosef - skaitļi runā</p>
</div>

<script>
function calculateDelta() {
  const stockPrice = parseFloat(document.getElementById('stockPrice').value);
  const strikePrice = parseFloat(document.getElementById('strikePrice').value);
  const iv = parseFloat(document.getElementById('iv').value) / 100;

  if (isNaN(stockPrice) || isNaN(strikePrice) || isNaN(iv)) {
    document.getElementById('result').innerHTML = "<b>Lūdzu, ievadi visus datus pareizi!</b>";
    return;
  }

  // Vienkāršots aprēķins: Delta tiek novērtēta pēc attāluma un svārstīguma
  let moneyness = (stockPrice - strikePrice) / (stockPrice * iv);
  let delta = 1 / (1 + Math.exp(-1.7 * moneyness));

  delta = Math.min(Math.max(delta, 0), 1); // Ierobežojam vērtību diapazonā 0-1

  document.getElementById('result').innerHTML =
    `<b>Aptuvenā Delta:</b> ${delta.toFixed(3)}<br>` +
    `Tas nozīmē aptuveni ${(delta * 100).toFixed(1)} % varbūtību, ka opcija beigsies ar peļņu.`;
}
</script>

</body>
</html>
