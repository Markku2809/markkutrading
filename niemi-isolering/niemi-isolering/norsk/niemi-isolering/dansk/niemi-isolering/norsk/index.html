<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Niemi Isolering – Produktkatalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#0a1022;color:#fff}
    .wrap{max-width:980px;margin:0 auto;padding:48px 20px;text-align:center}
    h1{color:#00e0b0;margin:0 0 8px}
    p{opacity:.9}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}
    .card{background:#111a34;border-radius:14px;padding:28px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
    .btn{display:inline-block;background:#00e0b0;color:#001018;text-decoration:none;font-weight:700;
         padding:12px 18px;border-radius:10px;margin-top:10px}
    .btn:hover{filter:brightness(1.1)}
    .footer{opacity:.8;margin-top:42px;font-size:.95rem}
    .back{position:fixed;left:14px;top:12px}
    a.back{color:#8bd7ff;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Takaisin AimTradingiin</a>
    <h1>NIEMI ISOLERING</h1>
    <p>Valitse kieli / Velg språk</p>

    <div class="grid">
      <div class="card">
        <h2>Norsk versjon</h2>
        <p>Forside + kaikki tekniset sivut</p>
        <a class="btn" href="norsk/">Avaa</a>
      </div>
      <div class="card">
        <h2>Dansk version</h2>
        <p>Forside + alle tekniske sider</p>
        <a class="btn" href="dansk/">Åbn</a>
      </div>
    </div>

    <div class="footer">
      © Niemi Isolering • markkuinvest@gmail.com
    </div>
  </div>
</body>
</html>
